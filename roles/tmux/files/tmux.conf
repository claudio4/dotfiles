# Fix colors
set -g default-terminal "screen-256color" # Optinal tmux-256color, but screen is more compatible.
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable mouse and system clipboard (osc 52)
set -g mouse on
set -g set-clipboard on

# Terminal title
set -g set-titles on
setw -g automatic-rename on

# Start numbering at 1 (as its easier to reach in the keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

###
# Keybins
###

# Prefix/leader
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Splits (in the same directory)
unbind %
bind % split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# spawn new windows in the same directory as the current pane. old functionality on N
unbind c
bind c new-window -c "#{pane_current_path}"
bind N new-window

# Vim pane nagivation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim pane navigation without prelix (Alt+hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Vim style yanking
bind y copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Toggle status bar
bind q set-option status

# Move clock to <prefix> T so the lowercase version is free to changge sessions
unbind t
bind T clock-mode

# Reload config
unbind r
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf"
