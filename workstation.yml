- name: Set-up workstation enviorment
  hosts: "{{ ansible_limit | default('localhost') }}"
  vars:
    homebrew_path: /home/linuxbrew/.linuxbrew
  environment:
    PATH: "{{ ansible_env.PATH }}:{{homebrew_path}}/bin"
  roles:
    - role: basic-tools
    - role: build-essentials
    - role: git
      tags: [git]
    - role: homebrew
      homebrew_use_become: true
      tags: [homebrew]
    - role: useful-dirs
    - role: go
      go_role_should_install: false
      tags: [golang]
    - role: bash
    - role: fish
    - role: zsh
      zsh_set_default_shell: false
    - role: vim
    - role: neovim
      neovim_role_should_install: false
      tags: [neovim]
    - role: tmux
    - role: wsl
      when: is_wsl
  tasks:
    - name: Debug all tool checks
      debug:
        msg:
          bat: "{{ is_bat_installed }}"
          fish: "{{ is_fish_installed }}"
          eza: "{{ is_eza_installed }}"
          fzf: "{{ is_fzf_installed }}"
          homebrew: "{{ is_homebrew_installed }}"
          nvim: "{{ is_nvim_installed }}"
          zoxide: "{{ is_zoxide_installed }}"
